[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "air2mqtt"
dynamic = ["version"]
description = "Reads BME680 and MH-Z19 sensors and publishes them to Home Assistant via MQTT."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fabian Arndt" }]
requires-python = ">=3.11"
dependencies = [
    "bme680>=2.0",
    "paho-mqtt>=2.1",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
air2mqtt = "air2mqtt.__main__:main"

[project.urls]
Repository = "https://github.com/Neluxx/air2mqtt"

[tool.setuptools.dynamic]
version = { attr = "air2mqtt.__version__" }

[tool.setuptools.packages.find]
include = ["air2mqtt*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
